[project]
name = "langchain-agent-chat"
version = "0.1.0"
description = "Minimal Vue 3 and LangChain agent chat with SSE."
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=0.3,<0.4",
  "langchain-openai>=0.3,<0.4",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.9,<3",
  "python-dotenv>=1.1,<2",
  "redis[hiredis]>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
exe = [
  "pyinstaller>=6.15,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

